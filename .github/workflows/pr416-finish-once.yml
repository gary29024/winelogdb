name: PR416 one-off research finalisation
on:
  push:
    branches: [research/echezeaux-bouchy-1995-expansion]
    paths: [.github/workflows/pr416-finish-once.yml]
permissions:
  contents: write
jobs:
  finalise:
    if: github.repository == 'gary29024/winelogdb' && github.ref == 'refs/heads/research/echezeaux-bouchy-1995-expansion'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Apply reviewed evidence and regenerate with the actual builders
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '9f692029b45564e91ce890db262b08a63ac4779b'
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import subprocess
          ROOT = Path.cwd()
          CP = ROOT / 'docs/research/echezeaux-farming-curation.json'
          c = json.loads(CP.read_text(encoding='utf-8'))
          assert len(c['sources']) == 176, 'Unexpected source baseline; stop rather than overwrite other work'
          SID = 'clerget-merger-completion-2023'
          assert not any(s['id'] == SID for s in c['sources'])
          c['sources'].append({
              'id': SID,
              'title': 'Domaine Christian Clerget: 11 December 2023 definitive merger approval, filed 15 December',
              'url': 'https://entreprises.lefigaro.fr/scev-du-domaine-christian-clerget-21/entreprise-431340140',
              'type': 'company-filing', 'documentDate': '2023-12-11', 'filingLabelDate': '2023-12-15',
              'reviewedAt': '2026-09-30', 'access': 'user-supplied-pdf-visual-review',
              'finding': 'The absorbing company unanimously approves the merger and expressly records satisfaction of its conditions and definitive completion on 11 December 2023 (PDF pp.2-3). This is completion evidence, unlike the previously reviewed project alone. The 39-page bundle contains decisions (pp.2-5), the repeated project (pp.6-23), and updated statutes (pp.24-39), but no cadastral property annex or notarial deposit act. It supports the existing D0796 ownership succession when read with the 2002 deed and annual rights records; it identifies no additional parcel or current farmer.',
              'originalFilename': 'Domaine Christian Clerget - Actes du 15-12-2023.pdf',
              'duplicateOriginalFilenames': ['Domaine Christian Clerget - Actes du 15-12-2023(1).pdf'],
              'sha256': '70b58304b30e9e80330f7a7d429ac4c17da4045b486892e144ed3ff42c55be3c',
              'pageCount': 39, 'reviewedPages': [2, 3, 4, 5, 7, 11, 12, 13, 20, 24, 26, 27, 39],
              'pageNumbering': 'one-based PDF',
              'retrievalNote': 'Both supplied copies have identical bytes and SHA-256 and are counted once. All 39 rendered pages were visually reviewed. The embedded project repeats the previously supplied 18-page GFV project; that repetition is not independent corroboration. Original PDFs are not redistributed.',
              'dateNote': '11 December 2023 is the date of the signed completion decisions; 15 December is the filing label. Project accounting/tax effect dates are not treated as the legal completion date.'
          })
          project = next(s for s in c['sources'] if s['id'] == 'clerget-gfv-fusion-2023')
          project['title'] = 'GFV Christian et Isabelle Clerget: 11 December 2023 merger project'
          project['finding'] = 'The project proposes transfer of the entire GFV patrimony (430384354) to SCEV du Domaine Christian Clerget (431340140), subject to approvals and completion. It lists aggregate land value but no cadastral schedule and refers to a separate notarial deposit act for origins of title. The absorbing-company decisions in clerget-merger-completion-2023 separately establish definitive completion; this project alone does not.'
          f = next(f for f in c['parcelFilings'] if f['id'] == 'clerget-d0796-2002')
          assert f['parcelAreasM2'] == {'212670000D0796': 2319}
          f['supportingSourceIds'] = [SID, 'dgfip-history']
          f['successorEvidence'].update({
              'sourceId': SID, 'projectSourceId': 'clerget-gfv-fusion-2023',
              'completionDate': '2023-12-11', 'effectiveDate': '2023-12-11', 'pages': [2, 3],
              'limitation': 'The absorbing-company decisions expressly record definitive completion. They do not enumerate D0796: its ownership succession uses the exact 2002 contribution, universal succession on completion, and annual DGFiP records. The separate notarial property-origin schedule remains absent. No current cultivation is established.'
          })
          f['finding'] = 'The 18 January 2002 deed contributes D0796 En Orveaux (2319 m²) to GFV Christian et Isabelle Clerget. The absorbing-company decisions record definitive completion of the merger into SCEV du Domaine Christian Clerget on 11 December 2023; annual rights records independently show the holder change. No additional parcel, separate property-origin schedule or current farming is established.'
          f['appNote'] = 'The 2002 deed contributes D0796 (0.2319 ha) to the Clerget GFV. Decisions dated 11 December 2023 confirm completion of its merger into the domaine company, consistent with annual rights records. This supports ownership succession, not current farming or additional parcels.'
          assert len(f['appNote']) <= 330
          hf = next(x for x in c['historyFindings'] if x['id'] == 'clerget-transfer')
          if SID not in hf['sourceIds']:
              hf['sourceIds'].append(SID)
          hf['finding'] = 'The 2002 deed identifies D0796 (2319 m²) as contributed to GFV Christian et Isabelle Clerget (430384354). The absorbing-company decisions dated 11 December 2023 expressly confirm definitive merger completion into SCEV du Domaine Christian Clerget (431340140). Annual DGFiP records show the GFV through the 2023 snapshot and the SCEV from 2024. Completion, filing date and snapshot date are distinct; none establishes current cultivation.'
          h = next(h for h in c['producerHoldings'] if h['id'] == 'clerget')
          if SID not in h['sourceIds']:
              h['sourceIds'].append(SID)
          h['finding'] = 'The estate publishes 1.09 ha En Orveaux. The 2002 deed identifies D0796 (2319 m² cadastral); 11 December 2023 completion decisions and annual rights records support succession from the GFV to the domaine company. The mapped cru overlap is about 2206 m², which is the area basis used by this census for its approximate 0.87 ha gap. No additional parcel is inferred from that comparison; the 39-page completion bundle contains no further property schedule.'
          for i, gap in enumerate(c['accessGaps']):
              if gap.startswith('Clerget D0796 is now traced exactly:'):
                  c['accessGaps'][i] = 'Clerget: the 15 December 2023 absorbing-company filing has now been reviewed (39 pages; duplicate upload counted once). Its 11 December decisions confirm definitive merger completion, but neither the notarial deposit act nor the cadastral property annex is included. D0796 ownership succession is supported by the 2002 deed, completion decisions and annual rights snapshots. Additional En Orveaux parcels and current farming remain unverified. Do not request this same filing again; pursue a separately identified free property or tenancy schedule only.'
                  break
          else:
              raise AssertionError('Expected Clerget access gap not found')
          CP.write_text(json.dumps(c, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          bp = ROOT / 'scripts/build_echezeaux_farming_research.py'
          s = bp.read_text(encoding='utf-8')
          needle = "        require(filing['sourceId'] in sources, 'Unknown filing source')\n"
          assert s.count(needle) == 1
          s = s.replace(needle, needle + "        require(set(filing.get('supportingSourceIds', [])) <= sources.keys(), 'Unknown supporting filing source')\n")
          needle = "        source = sources[filing['sourceId']]\n        refs = "
          assert s.count(needle) == 1
          s = s.replace(needle, "        source_ids = list(dict.fromkeys([filing['sourceId'], *filing.get('supportingSourceIds', [])]))\n        cited = ', '.join(f\"[{cell(sources[s]['title'])}]({sources[s]['url']})\" for s in source_ids)\n        refs = ")
          needle = '                  f"[{cell(source[\'title\'])}]({source[\'url\']})."]'
          assert s.count(needle) == 1
          s = s.replace(needle, '                  f"{cited}."]')
          bp.write_text(s, encoding='utf-8')
          ep = ROOT / 'scripts/build_echezeaux_parcel_evidence.py'
          s = ep.read_text(encoding='utf-8')
          needle = "                                'sources': [filing['sourceId']]})"
          assert s.count(needle) == 1
          s = s.replace(needle, "                                'sources': list(dict.fromkeys([filing['sourceId'], *filing.get('supportingSourceIds', [])]))})")
          ep.write_text(s, encoding='utf-8')
          tp = ROOT / 'scripts/test_echezeaux_farming_research.py'
          s = tp.read_text(encoding='utf-8')
          needle = '    def test_founding_mandates_keep_named_and_unnamed_tenants_distinct(self):\n'
          assert s.count(needle) == 1
          new_tests = '''    def test_clerget_completion_source_is_cited_without_redating_the_deed(self):
                  sid = 'clerget-merger-completion-2023'
                  filing = next(f for f in self.curation['parcelFilings'] if f['id'] == 'clerget-d0796-2002')
                  source = next(s for s in self.curation['sources'] if s['id'] == sid)
                  self.assertEqual(source['documentDate'], '2023-12-11')
                  self.assertEqual(source['filingLabelDate'], '2023-12-15')
                  self.assertEqual(source['pageCount'], 39)
                  self.assertEqual(sum(s.get('sha256') == source['sha256'] for s in self.curation['sources']), 1)
                  self.assertEqual(filing['successorEvidence']['sourceId'], sid)
                  self.assertEqual(filing['successorEvidence']['completionDate'], '2023-12-11')
                  result = self.build()
                  self.assertEqual(result['counts']['unresolved'], 127)
                  self.assertEqual(result['counts']['withParcelFiling'], 28)
                  evidence = build_evidence(result, self.curation, self.history, json.loads(self.asset)['features'])
                  item = next(i for i in evidence['parcels']['212670000D0796'] if i['kind'] == 'filing')
                  self.assertEqual(item['date'], '2002-01-18')
                  self.assertEqual(item['sources'], ['clerget-gfv-apport-2002', sid, 'dgfip-history'])
                  self.assertTrue(all(p['currentFarmer'] is None for p in result['parcels']))
          
              def test_unknown_supporting_filing_source_is_rejected(self):
                  curation = copy.deepcopy(self.curation)
                  filing = next(f for f in curation['parcelFilings'] if f['id'] == 'clerget-d0796-2002')
                  filing['supportingSourceIds'] = ['not-a-source']
                  with self.assertRaisesRegex(ValueError, 'Unknown supporting filing source'):
                      self.build(curation)
          
          '''
          s = s.replace(needle, new_tests + needle)
          s = s.replace("self.assertEqual(result['counts']['withParcelFiling'], 27)", "self.assertEqual(result['counts']['withParcelFiling'], 28)")
          tp.write_text(s, encoding='utf-8')
          sp = ROOT / 'docs/echezeaux-statutes-research.md'
          s = sp.read_text(encoding='utf-8')
          s = s.replace('Fifty-five uploaded PDFs have now been reviewed across eight batches, including free registry-mirror copies.', 'Fifty-six distinct supplied PDF copies have now been reviewed, including free registry mirrors. The duplicate upload of the 39-page Clerget completion filing is counted once.')
          s = s.replace('Twenty-four individual areas match the pinned snapshot;', 'Twenty-five individual areas match the pinned snapshot;')
          s = s.replace('with **176 logged source entries**', 'with **177 logged source entries**')
          s = s.replace('Source entries include overlapping copies, not 147 independent instruments.', 'Source entries include overlapping copies and discovery indexes; they are not a count of independent instruments.')
          s = s.replace('The latest seven-file unresolved-parcel batch mostly produces negative but useful evidence: it rules out several operating-company/GFA filings as the missing Échezeaux parcel schedules and identifies Bouchard Annex 3.1 as the next free document worth pursuing.', 'The latest Clerget filing confirms definitive merger completion without adding a cadastral schedule. Its missing notarial property material and the missing Bouchard annex remain gaps; repeated copies are not further evidence.')
          s = re.sub(r'\*\*Next free Clerget target:\*\*[^\n]*', '**Clerget follow-up completed:** the absorbing-company filing labelled 15 December 2023 is now reviewed. It confirms completion but contains no property-origin annex or notarial deposit act. Do not request this same filing again.', s)
          section = '''## Clerget completion filing: 15 December 2023 label, 11 December decisions
          
          The newly supplied **39-page** bundle was uploaded twice with identical bytes (SHA-256 below); count it once. It contains the absorbing company's unanimous decisions (PDF pp.2-5), the previously reviewed merger project (pp.6-23), and updated statutes (pp.24-39).
          
          **New evidence, PDF pp.2-3:** the absorbing company approves the merger, records satisfaction of the conditions, and expressly declares definitive completion on **11 December 2023**. The earlier project alone did not establish completion. The **15 December 2023** filing label and annual DGFiP observation dates are different events and must not replace the completion date.
          
          **Still missing:** the project repeated at PDF p.12 refers to origins of title being set out in a separate notarial deposit act and to an annex describing the properties. Neither that instrument nor a cadastral property annex appears anywhere in this 39-page bundle. The retained original contributions in the operating-company statutes (pp.26-27) describe cash and movable business assets, not an additional En Orveaux parcel schedule.
          
          D0796 remains the exact parcel identified by the **2002** contribution. The new completion decisions strengthen the corporate succession already suggested by annual rights records; they do not themselves enumerate D0796 or identify any further parcel. Keep **28 parcels with exact filing evidence, 127 unresolved parcels and zero confirmed current farmers**. The source log now contains **177 entries**. Cadastre area for D0796 is 2,319 m²; the census uses its approximately 2,206 m² cru overlap, so the approximate 0.87 ha published-area gap is not a surveyed area of unidentified cultivated land.
          
          The dated D0796 app entry now cites the 2002 deed, the separate completion filing and the annual rights data. Its displayed deed date remains **18 January 2002**. The strict generator check is retained and all generated outputs are rebuilt rather than manually patched.
          
          **Next upload:** none requested for this completed batch. Reopen the Clerget/Bouchard annex searches only for a specifically identified, freely accessible new property or tenancy instrument, not another mirror of the same bundle. Paid records and domaine cooperation remain deferred.
          
          Source: [Domaine Christian Clerget, absorbing-company filing](https://entreprises.lefigaro.fr/scev-du-domaine-christian-clerget-21/entreprise-431340140).
          
          '''
          assert '## Highest-value next sources' in s
          s = s.replace('## Highest-value next sources', section + '## Highest-value next sources', 1)
          s += '\n### Clerget completion filing provenance\n\n| Supplied filename | PDF pages | SHA-256 |\n| --- | ---: | --- |\n| Domaine Christian Clerget - Actes du 15-12-2023.pdf | 39 | 70b58304b30e9e80330f7a7d429ac4c17da4045b486892e144ed3ff42c55be3c |\n\nThe second upload, `Domaine Christian Clerget - Actes du 15-12-2023(1).pdf`, is byte-identical and is not counted as a second source. All 39 pages were reviewed visually; original PDFs are not redistributed.\n'
          sp.write_text(s, encoding='utf-8')
          fp = ROOT / 'docs/echezeaux-farming-research.md'
          s = fp.read_text(encoding='utf-8')
          s = s.replace('with a source log of **176 records**', 'with a source log of **177 records**')
          s = re.sub(r'The next free document to inspect is therefore the \*\*15 December 2023 Domaine Christian Clerget filing\*\*[^\n]*', 'The absorbing-company filing labelled **15 December 2023** has now been reviewed: it supplies explicit completion decisions, but not the separate notarial property-origin schedule. No repeat upload of that bundle is needed.', s)
          section = '''### Clerget merger completion is now documented separately
          
          The 39-page absorbing-company filing labelled **15 December 2023** contains unanimous decisions dated **11 December 2023** expressly recording definitive merger completion (PDF pp.2-3). This is stronger evidence than the project alone. The embedded 18-page project repeats previously reviewed material and is not independent corroboration. Two identical uploads of this 39-page file are counted as one source.
          
          The same bundle still does not contain the notarial deposit act or cadastral property annex referenced at PDF p.12. It strengthens D0796's ownership-succession evidence but identifies no further parcel or current farmer. Current totals remain **28 parcels with exact company-filing evidence and 127 without a named candidate**; the source log is **177 entries**. No further upload is requested for this batch.
          
          '''
          assert '### Independent research: Winehog' in s
          s = s.replace('### Independent research: Winehog', section + '### Independent research: Winehog', 1)
          fp.write_text(s, encoding='utf-8')
          subprocess.run(['python', 'scripts/build_echezeaux_farming_research.py'], check=True)
          subprocess.run(['python', 'scripts/build_echezeaux_farming_research.py', '--check'], check=True)
          subprocess.run(['python', '-m', 'unittest', 'discover', '-s', 'scripts', '-p', 'test_echezeaux_farming_research.py'], check=True)
          r = json.loads((ROOT / 'docs/research/echezeaux-farming-parcels.json').read_text(encoding='utf-8'))
          assert r['counts']['unresolved'] == 127 and r['counts']['withParcelFiling'] == 28
          assert all(p['currentFarmer'] is None for p in r['parcels'])
          print('FINAL_COUNTS=' + json.dumps(r['counts'], sort_keys=True))
          print('FINAL_SOURCE_COUNT=' + str(len(c['sources'])))
          PY
      - name: Stage tested result without changing the PR branch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr416-finish-once.yml
          git diff --check
          git add -- docs/research/echezeaux-farming-curation.json docs/research/echezeaux-farming-parcels.json docs/echezeaux-farming-parcel-register.md docs/echezeaux-statutes-research.md docs/echezeaux-farming-research.md src/lib/places/echezeauxParcelEvidence.json scripts/build_echezeaux_farming_research.py scripts/build_echezeaux_parcel_evidence.py scripts/test_echezeaux_farming_research.py .github/workflows/pr416-finish-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record Clerget merger completion and regenerate research evidence'
          target='automation/pr416-clerget-completion-20260930'
          if git ls-remote --exit-code --heads origin "$target"; then
            echo 'Staging branch already exists; refusing to overwrite it.'
            exit 1
          fi
          git push origin "HEAD:refs/heads/$target"
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          git show --stat --oneline HEAD
