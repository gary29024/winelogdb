name: Vintage data

# Rebuilds public/data/vintages (Burgundy, Bordeaux, then Champagne) from Météo-France open data (COMÉPHORE 1 km
# rain, SAFRAN 8 km temperature) and commits the result. Monthly through the
# season so a new vintage fills in as its months are published; past years are
# cached and never downloaded twice.
on:
  schedule:
    # 03:00 on the 6th in Japan (GMT+9) = 18:00 UTC on the 5th; cron is UTC.
    # Runs overnight so it does not race daytime merges into main.
    - cron: '0 18 5 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vintage-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Fetch and build
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/vintages/pipeline/requirements.txt
      - run: pip install -r scripts/vintages/pipeline/requirements.txt
      # Restore and save are split so the downloads are kept even when a later
      # step fails; a re-run then skips the hour of fetching.
      - name: Restore downloaded history
        uses: actions/cache/restore@v4
        with:
          path: scripts/vintages/cache
          key: vintage-weather-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vintage-weather-
      - name: Fetch new and missing years
        run: python scripts/vintages/pipeline/fetch.py
      - name: Measured must sugar from the BIVB maturity network
        run: python scripts/vintages/pipeline/bivb.py
      - name: Build the page data
        run: python scripts/vintages/pipeline/build.py
      - name: Quality outlook from the critics' consensus
        run: python scripts/vintages/pipeline/quality.py
      - name: Bordeaux - fetch, measured sugar, build, quality outlook
        env:
          VINTAGE_REGION: bordeaux
        run: |
          python scripts/vintages/pipeline/fetch.py
          python scripts/vintages/pipeline/bordeaux_raisins.py
          python scripts/vintages/pipeline/build.py
          python scripts/vintages/pipeline/quality.py
      - name: Champagne - fetch, measured must and harvest starts, build, quality outlook
        env:
          VINTAGE_REGION: champagne
        run: |
          python scripts/vintages/pipeline/fetch.py
          python scripts/vintages/pipeline/champagne_must.py
          python scripts/vintages/pipeline/build.py
          python scripts/vintages/pipeline/quality.py
      - name: Save downloaded history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scripts/vintages/cache
          key: vintage-weather-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit if anything changed
        run: |
          git add public/data/vintages scripts/vintages/data/outlook_record.csv scripts/vintages/data/bivb_sugar.csv scripts/vintages/data/bordeaux/measured_sugar.csv scripts/vintages/data/bordeaux/outlook_record.csv scripts/vintages/data/champagne/measured_sugar.csv scripts/vintages/data/champagne/umc_harvest.csv scripts/vintages/data/champagne/harvest_dates.csv scripts/vintages/data/champagne/outlook_record.csv
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh vintage data from Météo-France, the BIVB, Bordeaux Raisins and the UMC"
          # The build takes over an hour and main often moves meanwhile, so
          # replay this commit on the latest main before pushing.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1
