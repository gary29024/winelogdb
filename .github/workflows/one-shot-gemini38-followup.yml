name: One-shot Gemini 3.8 follow-up

on:
  push:
    branches: [feat/gemini-3-8-flash]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gemini-3-8-flash
          fetch-depth: 0
      - name: Fix stale vintage references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          handler=Path('worker/vintageWindowHandler.ts')
          text=handler.read_text()
          count=text.count('3.7 Flash')
          if count != 2:
              raise SystemExit(f'expected exactly 2 stale 3.7 Flash comments, found {count}')
          handler.write_text(text.replace('3.7 Flash','3.8 Flash'))

          test=Path('tests/unit/vintageLookupRequest.test.ts')
          text=test.read_text()
          old="ESCALATION_MODEL='gemini-3\\.7-flash'"
          new="ESCALATION_MODEL='gemini-3\\.8-flash'"
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale vintage assertion, found {text.count(old)}')
          test.write_text(text.replace(old,new))
          PY
      - name: Remove workflow and commit
        shell: bash
        run: |
          rm .github/workflows/one-shot-gemini38-followup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Gemini 3.8 vintage assertions"
          git push origin HEAD:feat/gemini-3-8-flash
