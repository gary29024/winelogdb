name: Vintage data probe

# Temporary: reads the shape of the Meteo-France open data from GitHub's
# network so the real pipeline can be written against it. Removed once the
# pipeline lands.
on:
  push:
    branches: [claude/vintage-analysis-insights-ajd0tc]
    paths: [.github/workflows/vintage-data-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Comephore resources
        run: |
          curl -sS --retry 3 "https://www.data.gouv.fr/api/1/datasets/669e23a7ce052a9e8521b75e/" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print(d['title']);print(d['description'][:3000])
          rs=d['resources'];print(len(rs),'resources')
          for r in rs[:25]+rs[-25:]: print('  ',r.get('format'),r.get('filesize'),r['title'],r['url'])
          "
      - name: Head of one Comephore file
        run: |
          url=$(curl -sS "https://www.data.gouv.fr/api/1/datasets/669e23a7ce052a9e8521b75e/" | python3 -c "
          import json,sys
          rs=json.load(sys.stdin)['resources']
          c=[r['url'] for r in rs if '2024' in r['url'] and r.get('format') not in ('pdf',)]
          print(c[0] if c else rs[0]['url'])
          ")
          echo "URL: $url"
          curl -sSIL "$url" | grep -iE "^HTTP|content-length|content-type|location"
      - name: Daily station files for Cote-d'Or, Yonne, Saone-et-Loire
        run: |
          curl -sS "https://www.data.gouv.fr/api/1/datasets/6569b51ae64326786e4e8e1a/" | python3 -c "
          import json,sys
          for r in json.load(sys.stdin)['resources']:
              if any(f'_{d}_' in r['url'] or f'departement_{d}' in r['url'] for d in ('21','89','71')) or 'descriptif' in r['title'].lower():
                  print('  ',r.get('format'),r.get('filesize'),r['title'],r['url'])
          "
