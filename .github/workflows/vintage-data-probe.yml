name: Vintage data probe

# Temporary: reads the Meteo-France data documentation and the ripening model
# papers from GitHub's network, which the authoring workspace cannot reach.
# Removed once the pipeline lands.
on:
  push:
    branches: [claude/vintage-analysis-insights-ajd0tc]
    paths: [.github/workflows/vintage-data-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Comephore description
        run: |
          curl -sSL --retry 3 -o c.pdf https://static.data.gouv.fr/resources/reanalyses-comephore/20260909-150531/radar-donnees-comephore-descriptif-20250604.pdf
          pdftotext -layout c.pdf - | head -250
      - name: SIM daily parameters
        run: |
          curl -sSL --retry 3 -o s.pdf https://static.data.gouv.fr/resources/donnees-changement-climatique-sim-quotidienne/20260331-150448/sim-quotidienne-parametres-20260331.pdf
          pdftotext -layout s.pdf - | head -200
      - name: Sugar ripeness model paper (Parker et al. 2020)
        run: |
          curl -sSL --retry 3 -A "Mozilla/5.0" -o o.html "https://oskar-bordeaux.fr/handle/20.500.12278/11298" || true
          grep -oE '(href|content)="[^"]*(bitstream|\.pdf)[^"]*"' o.html | sort -u | head -20
          for u in $(grep -oE 'https?://[^"]*bitstream[^"]*\.pdf[^"]*' o.html | sort -u | head -3) $(grep -oE '/bitstream/[^"]*\.pdf[^"]*' o.html | sort -u | sed 's#^#https://oskar-bordeaux.fr#' | head -3); do
            echo "== $u"; curl -sSL --retry 2 -A "Mozilla/5.0" -o p.pdf "$u" && file p.pdf && pdftotext -layout p.pdf p.txt && grep -n -iE "F\*|base temperature|starting|day of year|t0|Table" p.txt | head -60 && break
          done
      - name: Find the flowering-veraison model papers
        run: |
          curl -sS "https://api.archives-ouvertes.fr/search/?q=title_t:(veraison%20AND%20flowering%20AND%20model)%20AND%20authFullName_t:Parker&fl=halId_s,title_s,fileMain_s,producedDateY_i&rows=10" | python3 -m json.tool | head -60
