name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-setup
      - name: Lint
        run: npm run lint
      # build already runs tsc -b; do not repeat typecheck in another job.
      - name: TypeScript and production build
        run: npm run build
      # Always exercise the real local runtime. Import/path selection cannot
      # describe the Worker, asset routing and migration boundary reliably.
      - name: Apply local D1 migrations
        run: npm run db:migrate:local
      - name: Worker runtime smoke
        run: node scripts/worker-runtime-smoke.mjs

  regression:
    name: Regression and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-setup
      # One invocation avoids graph-selection startup and duplicate shard setup.
      # Fresh SQLite copies keep the full integration suite cheap enough for PRs.
      - name: All unit, component and integration tests
        run: npm test -- --reporter=default --reporter=json --outputFile=.cache/test-reports/vitest.json
      - name: Test inventory and timing report
        run: node scripts/test-suite-report.mjs .cache/test-reports/vitest.json > .cache/test-reports/inventory.json
      - name: Install PR browser
        if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium
      - name: Install checkpoint browsers
        if: github.event_name != 'pull_request'
        run: npx playwright install --with-deps chromium webkit
      - name: Chromium flows on every PR
        if: github.event_name == 'pull_request'
        run: npm run test:e2e
      - name: All browser flows and iPhone layouts at checkpoints
        if: github.event_name != 'pull_request'
        run: npm run test:e2e:full
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            .cache/test-reports/
            test-results/
            playwright-report/
          retention-days: 7
          include-hidden-files: true
