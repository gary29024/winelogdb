name: CI

on:
  pull_request:
    branches: [main]
    # ready_for_review: a draft skips browser flows, so they run once it is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    name: Select checks
    runs-on: ubuntu-latest
    outputs:
      quality: ${{ steps.select.outputs.quality }}
      platform: ${{ steps.select.outputs.platform }}
      unit: ${{ steps.select.outputs.unit }}
      research: ${{ steps.select.outputs.research }}
      sourceReaders: ${{ steps.select.outputs.sourceReaders }}
      chromium: ${{ steps.select.outputs.chromium }}
      webkit: ${{ steps.select.outputs.webkit }}
      specs: ${{ steps.select.outputs.specs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify scope policy
        run: node --test scripts/ci-scope.test.mjs
      - name: Select PR impact or full checkpoint
        id: select
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            if ! git diff --no-renames --name-only -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files"; then
              : > "$RUNNER_TEMP/changed-files"
            fi
            flags=()
            if [ "$DRAFT" = true ]; then flags+=(--draft); fi
            node scripts/ci-scope.mjs --changed-file "$RUNNER_TEMP/changed-files" "${flags[@]}"
          elif [ "$EVENT_NAME" = push ]; then
            # A merge of a PR was already checked on that PR; a direct push gets the full checkpoint.
            merged=$(gh api "repos/$REPO/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null)] | length' || echo 0)
            if [ "${merged:-0}" -gt 0 ]; then
              node scripts/ci-scope.mjs --merged-pr
            else
              node scripts/ci-scope.mjs --checkpoint
            fi
          else
            node scripts/ci-scope.mjs --checkpoint
          fi

  # Runner minutes are billed per machine, each rounded up to a whole minute, and every machine
  # repeats checkout and install. So the selected checks share two machines: this one and `browser`.
  quality:
    name: Lint and build
    needs: scope
    # A merge of an already-checked PR selects nothing, so no machine starts for it.
    if: github.event_name != 'push' || needs.scope.outputs.quality == 'true' || needs.scope.outputs.research == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        if: needs.scope.outputs.quality == 'true' || needs.scope.outputs.research == 'true'
        with:
          # Vitest's --changed compares against the PR base, so it needs history.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: needs.scope.outputs.research == 'true'
        with:
          python-version: '3.12'
      # Loops over every scripts/grand-crus/<slug>.json; a cru without research yet has its config validated.
      # Also checks the shared holder-to-domaine table against every cru's recorded holders.
      - name: Committed research outputs match every cru's curation
        if: needs.scope.outputs.research == 'true'
        run: python scripts/build_grand_cru_research.py --all --check
      - name: App registry matches every cru config
        if: needs.scope.outputs.research == 'true'
        run: python scripts/build_grand_cru_app_registry.py --check
      - name: Earlier-bulletin reviewed rows match their curated decisions
        if: needs.scope.outputs.research == 'true'
        run: |
          python scripts/build_earlier_bulletin_reviews.py --department cote-dor --check
          python scripts/build_earlier_bulletin_reviews.py --department yonne --check
      - name: Install geometry packages
        if: needs.scope.outputs.research == 'true'
        run: python -m pip install -r scripts/burgundy-map-requirements.txt
      - name: Historical evidence and cru config regressions
        if: needs.scope.outputs.research == 'true'
        working-directory: scripts
        run: python -m unittest test_grand_cru_research test_grand_cru_holder_links test_grand_cru_config test_grand_cru_parcels test_grand_cru_rights_history test_grand_cru_filiation test_grand_cru_source_inventory test_grand_cru_spatial_lineage test_grand_cru_notice_history test_grand_cru_sale_records test_grand_cru_history_rollout test_build_earlier_bulletin_reviews test_pull_wayback_bulletins test_pull_commoncrawl_bulletins test_pull_grand_cru_notice_bulletins test_index_cotedor_bulletins
      - uses: ./.github/actions/test-setup
        id: setup
        if: ${{ !cancelled() && (needs.scope.outputs.quality == 'true' || needs.scope.outputs.unit != 'none') }}
      # Lint, formatting, build and unit tests each run even if an earlier one failed,
      # so one round reports every failure instead of one failure per push.
      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.scope.outputs.quality == 'true' }}
        run: npm run lint
      - name: Formatting of converted and newly added files
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.scope.outputs.quality == 'true' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            npm run format:check -- --base "$BASE_SHA"
          else
            npm run format:check
          fi
      - name: TypeScript and production build
        id: build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.scope.outputs.quality == 'true' }}
        run: |
          npm run build
          python scripts/measure_grand_cru_payload.py
      - name: Full unit, component and integration suite
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.scope.outputs.unit == 'full' }}
        run: npm test -- --maxWorkers=2 --reporter=default --reporter=json --outputFile=.cache/test-reports/vitest.json
      - name: Affected tests and source-reading contracts
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.scope.outputs.unit == 'changed' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_READERS: ${{ needs.scope.outputs.sourceReaders }}
        run: |
          set -euo pipefail
          selection="$RUNNER_TEMP/selected-tests.txt"
          npx vitest list tests/unit --changed "$BASE_SHA" --filesOnly > "$selection"
          if [ "$SOURCE_READERS" = true ]; then
            node scripts/source-text-tests.mjs >> "$selection"
          fi
          sort -u "$selection" -o "$selection"
          sed -i '/^$/d' "$selection"
          if [ ! -s "$selection" ]; then
            echo 'No affected tests resolved; running the full unit suite.'
            npm test -- --maxWorkers=2 --reporter=default --reporter=json --outputFile=.cache/test-reports/vitest.json
          else
            echo "Running $(wc -l < "$selection") affected test files:"
            cat "$selection"
            mapfile -t files < "$selection"
            npx vitest run --maxWorkers=2 --reporter=default --reporter=json --outputFile=.cache/test-reports/vitest.json "${files[@]}"
          fi
      - name: Test inventory and timing report
        if: ${{ !cancelled() && needs.scope.outputs.unit != 'none' }}
        run: |
          if [ -f .cache/test-reports/vitest.json ]; then
            node scripts/test-suite-report.mjs .cache/test-reports/vitest.json > .cache/test-reports/inventory.json
          fi
      - name: Upload unit test reports
        if: ${{ !cancelled() && needs.scope.outputs.unit != 'none' }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: .cache/test-reports/
          retention-days: 7
          include-hidden-files: true
      # The platform gate needs a successful build, so it keeps the default "stop after a failure".
      - name: Apply local D1 migrations
        if: needs.scope.outputs.platform == 'true'
        run: npm run db:migrate:local
      - name: Worker runtime smoke
        if: needs.scope.outputs.platform == 'true'
        run: node scripts/worker-runtime-smoke.mjs
      - name: Chromium for real-stack sharing
        if: needs.scope.outputs.platform == 'true'
        uses: ./.github/actions/playwright
        with:
          browser: chromium
      - name: Local browser-to-Worker sharing journey
        if: needs.scope.outputs.platform == 'true'
        run: npm run test:stack
      - name: Upload sharing journey failures
        if: failure() && needs.scope.outputs.platform == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sharing-journey-failures
          path: test-results/
          retention-days: 7
      - name: Documentation change
        if: needs.scope.outputs.quality == 'false'
        run: echo 'No executable files changed.'

  # Chromium and the iPhone WebKit projects share one machine. Each browser's flows run
  # whether or not the other's passed, and the job fails if either does.
  browser:
    name: Browser tests
    needs: scope
    if: needs.scope.outputs.chromium != 'none' || needs.scope.outputs.webkit == 'true'
    runs-on: ubuntu-latest
    # The weekly exhaustive Burgundy map run takes about 14 minutes of Chromium flows alone.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-setup
      - name: Chromium browser
        id: chromium
        if: needs.scope.outputs.chromium != 'none'
        # A stalled package download should fail here, not use up the whole job's time.
        timeout-minutes: 6
        uses: ./.github/actions/playwright
        with:
          browser: chromium
      - name: WebKit browser
        id: webkit
        if: ${{ !cancelled() && needs.scope.outputs.webkit == 'true' }}
        timeout-minutes: 6
        uses: ./.github/actions/playwright
        with:
          browser: webkit
      - name: Chromium flows
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' && needs.scope.outputs.chromium == 'full' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
        run: npm run test:e2e
      - name: Chromium flows with exhaustive Burgundy maps
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' && needs.scope.outputs.chromium == 'full' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        env:
          WINELOG_E2E_EXHAUSTIVE_MAPS: '1'
        run: npm run test:e2e
      - name: Affected Chromium flows
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' && needs.scope.outputs.chromium == 'selected' }}
        shell: bash
        env:
          SPECS: ${{ needs.scope.outputs.specs }}
        run: |
          mapfile -t specs < <(node -e 'JSON.parse(process.env.SPECS).forEach(spec => console.log(spec))')
          test "${#specs[@]}" -gt 0
          npm run test:e2e -- "${specs[@]}"
      # Playwright empties test-results/ when a run starts, so keep Chromium's before WebKit runs.
      - name: Keep Chromium reports
        if: ${{ !cancelled() && needs.scope.outputs.chromium != 'none' }}
        shell: bash
        run: |
          mkdir -p browser-reports/chromium
          for folder in test-results playwright-report; do
            if [ -d "$folder" ]; then mv "$folder" "browser-reports/chromium/$folder"; fi
          done
      - name: Both iPhone projects
        if: ${{ !cancelled() && steps.webkit.outcome == 'success' }}
        run: npm run test:e2e:full -- --project="iPhone*"
      - name: Keep WebKit reports
        if: ${{ !cancelled() && needs.scope.outputs.webkit == 'true' }}
        shell: bash
        run: |
          mkdir -p browser-reports/webkit
          for folder in test-results playwright-report; do
            if [ -d "$folder" ]; then mv "$folder" "browser-reports/webkit/$folder"; fi
          done
      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-reports
          path: browser-reports/
          retention-days: 7

  regression:
    name: Regression and browser tests
    # Nothing was selected for a merge of an already-checked PR, so there is nothing to confirm.
    if: always() && (github.event_name != 'push' || needs.scope.result != 'success' || needs.scope.outputs.quality == 'true')
    needs: [scope, quality, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every selected check to pass
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          CHROMIUM_MODE: ${{ needs.scope.outputs.chromium }}
          WEBKIT_MODE: ${{ needs.scope.outputs.webkit }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$QUALITY_RESULT" = success
          if [ "$CHROMIUM_MODE" != none ] || [ "$WEBKIT_MODE" = true ]; then test "$BROWSER_RESULT" = success; fi
