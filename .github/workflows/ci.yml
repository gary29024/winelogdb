name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-setup
      - name: Lint
        run: npm run lint
      # build already runs tsc -b; do not repeat typecheck in another job.
      - name: TypeScript and production build
        run: npm run build
      - name: Apply local D1 migrations
        run: npm run db:migrate:local
      - name: Worker runtime smoke
        run: node scripts/worker-runtime-smoke.mjs

  unit:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-setup
      # Vitest otherwise uses CPUs minus one: only one worker on a two-core
      # hosted runner. Keep isolation and use both cores, with bounded memory.
      - name: All unit, component and integration tests
        run: npm test -- --maxWorkers=2 --reporter=default --reporter=json --outputFile=.cache/test-reports/vitest.json
      - name: Test inventory and timing report
        run: node scripts/test-suite-report.mjs .cache/test-reports/vitest.json > .cache/test-reports/inventory.json
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: .cache/test-reports/
          retention-days: 7
          include-hidden-files: true

  browser:
    name: Browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # PRs keep Chromium; main/manual/weekly runs also keep both iPhone
        # projects. WebKit installation and execution cannot delay Chromium.
        browser: ${{ fromJSON(github.event_name == 'pull_request' && '["chromium"]' || '["chromium","webkit"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-setup
      - name: Install browser and operating-system libraries
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Chromium flows
        if: matrix.browser == 'chromium'
        run: npm run test:e2e
      - name: Both iPhone layouts
        if: matrix.browser == 'webkit'
        run: npm run test:e2e:full -- --project="iPhone*"
      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-reports-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  regression:
    # Preserve the required check name while work runs independently above.
    name: Regression and browser tests
    if: always()
    needs: [unit, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every regression job to pass
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$UNIT_RESULT" = success && test "$BROWSER_RESULT" = success
