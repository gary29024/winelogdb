name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: npm run lint

      - name: TypeScript and production build
        run: npm run build

  pr-tests:
    name: Affected unit tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install

      - name: Choose test scope
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed_file="$RUNNER_TEMP/changed-files.txt"
          git diff --name-only "$BASE_SHA"...HEAD | sed '/^$/d' > "$changed_file"
          changed_count=$(wc -l < "$changed_file" | tr -d ' ')

          echo "Changed files ($changed_count):"
          cat "$changed_file"

          # Documentation-only changes cannot affect runtime behaviour.
          if ! grep -Ev '^(README\.md|CHANGELOG\.md|SETUP\.md|docs/)' "$changed_file" | grep -q .; then
            mode=none
            reason="documentation-only change"
          # Large refactors and files outside the TypeScript dependency graph
          # get the full suite because Vitest cannot safely infer every consumer.
          elif [ "$changed_count" -gt 40 ] || grep -Eq '^(package\.json|vite\.config\.ts|tsconfig.*\.json|eslint\.config\.(js|mjs|ts)|wrangler\.(toml|jsonc)|\.github/|migrations/|tests/unit/fixtures/)|\.(css|sql|json)$' "$changed_file"; then
            mode=full
            reason="broad or dependency-graph-opaque change"
          else
            mode=changed
            reason="Vitest dependency graph can target affected tests"
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Selected $mode test scope: $reason"

      - name: Run affected unit tests
        if: steps.scope.outputs.mode == 'changed'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npx vitest run tests/unit --changed "$BASE_SHA" --passWithNoTests

      - name: Run full unit suite for high-risk changes
        if: steps.scope.outputs.mode == 'full'
        run: npm test

      - name: Skip unit tests for docs-only changes
        if: steps.scope.outputs.mode == 'none'
        run: echo "No runtime files changed; unit tests are not required."

  regression:
    name: Full regression (${{ matrix.shard }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1/2
          - 2/2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install

      - name: Run regression shard
        run: npm test -- --shard=${{ matrix.shard }}
